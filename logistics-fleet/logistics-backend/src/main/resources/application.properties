spring.application.name=logistics-backend
server.port=8080

# ---------- MySQL ----------
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------- JPA ----------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata
spring.jackson.time-zone=Asia/Kolkata
spring.jackson.serialization.write-dates-as-timestamps=false

# ---------- JWT ----------
# Base64 encoded 256-bit key. CHANGE IT in production (e.g. openssl rand -base64 32)
jwt.secret=${JWT_SECRET}
# access token: 1 hour, refresh: 1 day, refresh with "remember me": 30 days
jwt.expiry=3600000
jwt.refresh-expiry=86400000
jwt.refresh-expiry-remember=2592000000

# ---------- Files ----------
file.upload-dir=uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# ---------- Mail (optional) ----------
# Leave app.mail.enabled=false to just log emails (reset links, OTPs) to the console.
app.mail.enabled=true
app.mail.from=${MAIL_USERNAME}
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ---------- App ----------
app.frontend-url=http://localhost:5173
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000
# When true, the delivery OTP is also returned to the driver app (handy for demos without SMS)
app.otp.dev-mode=false
# Default admin created on first start
app.admin.username=admin
app.admin.email=admin@logistics.local
app.admin.password=${APP_ADMIN_PASSWORD}
# Also create one demo user per role + a warehouse, driver and vehicle
app.seed.demo-data=true

logging.level.com.logistics=INFO
